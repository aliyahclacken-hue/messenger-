<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Messenger</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--accent);color:var(--accentText)}h1,h2,h3{margin:0}h1{font-size:1.35rem}h2{font-size:1.2rem;margin-bottom:14px}h3{font-size:1.05rem;margin:12px 0 8px}main{max-width:760px;margin:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}.hidden{display:none!important}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select,button{font:inherit;border-radius:10px}input,textarea,select{width:100%;border:1px solid var(--border);padding:11px 12px;background:var(--card);color:var(--text)}textarea{min-height:84px;resize:vertical}button{width:100%;min-height:48px;border:0;padding:10px 14px;font-weight:750;background:var(--accent);color:var(--accentText);margin-top:9px}button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}button.danger{background:var(--danger)}button.inline{width:auto;min-height:42px;margin:0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .inline{flex:0 0 auto}.status{min-height:24px;margin:6px 0;font-weight:650}.muted{color:var(--muted)}.list{list-style:none;padding:0;margin:0}.list li{border-top:1px solid var(--border);padding:10px 0}.list li:first-child{border-top:0}.chat-button{text-align:left;background:transparent;color:var(--text);border:0;padding:5px 0;margin:0}.chat-name{display:block;font-weight:800}.chat-meta,.chat-preview{display:block;color:var(--muted);margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.toolbar button{margin:0}.pill-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.pill-row button{width:auto;white-space:nowrap;margin:0;min-height:42px}.selected{outline:3px solid var(--focus)}#messages{min-height:42vh;max- </head>
<body>
<header><h1 id="pageTitle">Messenger</h1></header>
<main>
<p id="globalStatus" class="status" role="status" aria-live="polite"></p>
<section id="authScreen" class="card">
<h2>Welcome</h2>
<div id="signInPanel">
<label for="signInEmail">Email</label><input id="signInEmail" type="email" autocomplete="email">
<label for="signInPassword">Password</label><input id="signInPassword" type="password" autocomplete="current-password">
<button id="signInButton">Sign in</button><button id="showCreateButton" class="secondary">Create account</button><button id="resetPasswordButton" class="secondary">Reset password</button>
</div>
<div id="createPanel" class="hidden">
<label for="displayName">Display name</label><input id="displayName" maxlength="40" autocomplete="name">
<label for="phoneNumber">Phone number</label><input id="phoneNumber" type="tel" autocomplete="tel" placeholder="+44 7700 900000">
<label for="createEmail">Email</label><input id="createEmail" type="email" autocomplete="email">
<label for="createPassword">Password</label><input id="createPassword" type="password" autocomplete="new-password" minlength="6">
<button id="createButton">Create account</button><button id="showSignInButton" class="secondary">Back to sign in</button>
</div>
</section>
<section id="appScreen" class="hidden">
<section id="homeScreen" class="card">
<div class="toolbar"><button id="newConversationButton">New conversation</button><button id="settingsButton" class="secondary">Settings</button></div>
<label for="chatSearch">Search chats</label><input id="chatSearch" type="search" placeholder="Search chats">
<div class="pill-row" aria-label="Chat filters"><button class="secondary selected" data-filter="all">All</button><button class="secondary" data-filter="individual">Individual</button><button class="secondary" data-filter="group">Groups</button></div>
<ul id="chatList" class="list"></ul><p id="emptyChats" class="muted">No chats yet.</p>
</section>
<section id="chatScreen" class="card hidden">
<div class="row"><button id="backFromChat" class="secondary inline">Back</button><button id="chatDetailsButton" class="secondary setting-button"><span id="chatHeading">Chat</span><span id="chatSubheading" class="setting-value"></span></button></div>
<p id="typingStatus" class="typing" aria-live="polite"></p>
<div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
<div id="replyBanner" class="card hidden"><span id="replyText"></span><button id="cancelReply" class="secondary">Cancel reply</button></div>
<form id="composer" class="composer"><label for="messageInput" class="sr-only">Message</label><textarea id="messageInput" maxlength="5000" placeholder="Message"></textarea><button id="sendButton" type="button">Send</button></form>
</section>
<section id="simpleScreen" class="card hidden"><div class="row"><button id="simpleBack" class="secondary inline">Back</button><h2 id="simpleTitle">Menu</h2></div><div id="simpleContent"></div></section>
</section>
</main>
<dialog id="actionDialog"><h2 id="actionTitle">Message options</h2><div id="actionButtons" class="menu"></div><button id="closeActionDialog" class="secondary">Close</button></dialog>
<script type="module">

import{getMessaging,getToken,onMessage,isSupported}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";
const firebaseConfig={apiKey:"AIzaSyA0seDdHj7OhNf6hx2-AZIDn1qhQpbFLTk",authDomain:"messenger-e50bf.firebaseapp.com",databaseURL:"https://messenger-e50bf-default-rtdb.europe-west1.firebasedatabase.app",projectId:"messenger-e50bf",storageBucket:"messenger-e50bf.firebasestorage.app",messagingSenderId:"751067866902",appId:"1:751067866902:web:2a705579192497a5a4d237"};
const vapidKey="BKIVCQ4_bGgcxccIRl_f6w9y1Ci9HFxaYPRXAVpCjnG7ABKf6y8BHoM3LJ_a4v-JmxLMZQndmLpuKSBUb0TXCVk";
const workerUrl="https://messengernotifications.aliyah-clacken.workers.dev";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),status=t=>$("globalStatus").textContent=t,show=(e,y=true)=>e.classList.toggle("hidden",!y);

const settings=JSON.parse(localStorage.getItem("messengerSettings")||"{}"),saveSettings=()=>localStorage.setItem("messengerSettings",JSON.stringify(settings));
function applySettings(){document.documentElement.classList.toggle("large",settings.textSize==="large");document.documentElement.classList.toggle("xlarge",settings.textSize==="xlarge");document.documentElement.classList.toggle("high-contrast",!!settings.highContrast)}applySettings();
function normalisePhone(v){let p=v.trim().replace(/[^\d+]/g,"");if(p.startsWith("00"))p="+"+p.slice(2);if(p.startsWith("0"))p="+44"+p.slice(1);if(!p.startsWith("+"))p="+"+p;return p}function phoneKey(p){return normalisePhone(p).replace(/\D/g,"")}function chatIdFor(a,b){return[a,b].sort().join("_")}function err(e){return(e?.message||"Something went wrong.").replace("Firebase: ","").replace(/\(auth\/[^)]+\)\.?/,"").trim()}function esc(s){return String(s??"")}function announce(t){status(t);if(settings.voiceAnnouncements&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function playSound(){if(settings.messageSound===false)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=720;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.16)}catch{}}

function goHome(){show($("homeScreen"),true);show($("chatScreen"),false);show($("simpleScreen"),false);$("pageTitle").textContent="Messenger";activeChat=null;replyTo=null;screenStack=[]}
function openSimple(title,renderer){screenStack.push({type:"simple",title});show($("homeScreen"),false);show($("chatScreen"),false);show($("simpleScreen"),true);$("simpleTitle").textContent=title;$("pageTitle").textContent=title;$("simpleContent").innerHTML="";renderer($("simpleContent"))}
function back(){if(!$("actionDialog").open===false){try{$("actionDialog").close();return}catch{}}if(!$("chatScreen").classList.contains("hidden")){goHome();return}if(screenStack.length>1){screenStack.pop();openSettingsMain(true)}else goHome()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();back()}});$("simpleBack").onclick=back;$("backFromChat").onclick=goHome;
$("showCreateButton").onclick=()=>{show($("signInPanel"),false);show($("createPanel"),true)};$("showSignInButton").onclick=()=>{show($("createPanel"),false);show($("signInPanel"),true)};
$("createButton").onclick=async()=>{const name=$("displayName").value.trim(),phone=normalisePhone($("phoneNumber").value),email=$("createEmail").value.trim(),pw=$("createPassword").value;if(!name||phone.length<8||!email||pw.length<6)return status("Enter all account details.");try{status("Creating account…");const c=await createUserWithEmailAndPassword(auth,email,pw),uid=c.user.uid,existing=await get(ref(db,"phoneDirectory/"+phoneKey(phone)));if(existing.exists()){await c.user.delete();throw Error("That phone number is already registered.")}await update(ref(db),{["users/"+uid]:{displayName:name,phone,createdAt:Date.now(),searchable:true},["phoneDirectory/"+phoneKey(phone)]:uid});status("Account created.")}catch(e){status(err(e))}};
$("signInButton").onclick=async()=>{try{status("Signing in…");await signInWithEmailAndPassword(auth,$("signInEmail").value.trim(),$("signInPassword").value);status("")}catch(e){status(err(e))}};$("resetPasswordButton").onclick=async()=>{const email=$("signInEmail").value.trim();if(!email)return status("Enter your email first.");try{await sendPasswordResetEmail(auth,email);status("Password reset email sent.")}catch(e){status(err(e))}};
onAuthStateChanged(auth,async u=>{currentUser=u;show($("authScreen"),!u);show($("appScreen"),!!u);if(stopChats)stopChats();if(!u){currentProfile=null;return}const s=await get(ref(db,"users/"+u.uid));currentProfile=s.val();if(!currentProfile)return status("Profile could not be loaded.");watchChats();goHome();setupForegroundPush()});
function watchChats(){stopChats=onValue(ref(db,"userChats/"+currentUser.uid),snap=>{chatEntries=[];snap.forEach(c=>chatEntries.push({id:c.key,...c.val()}));renderChats()})}
function renderChats(){const q=$("chatSearch").value.trim().toLowerCase();let a=chatEntries.filter(c=>!c.blocked&&(!q||(c.chatName||c.otherName||"").toLowerCase().includes(q)));if(currentFilter!=="all")a=a.filter(c=>c.type===currentFilter);a.sort((x,y)=>{if(!!x.pinned!==!!y.pinned)return x.pinned?-1:1;return(y.updatedAt||0)-(x.updatedAt||0)});const l=$("chatList");l.innerHTML="";show($("emptyChats"),a.length===0);for(const c of a){const li=document.createElement("li"),b=document.createElement("button");b.className="chat-button";const name=c.nickname||c.chatName||c.otherName||"Conversation",typing=c.typingText||"",preview=typing||c.lastMessage||"No messages yet",unread=c.unreadCount||0;b.innerHTML=`<span class="chat-name">${esc(name)}${c.type==="group"?", group chat":""}${unread?`, ${unread} unread`:""}${c.pinned?", pinned":""}</span><span class="chat-preview">${esc(preview)}</span>`;b.onclick=()=>openChat(c);li.append(b);l.append(li)}}
$("chatSearch").oninput=renderChats;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("selected",x===b));renderChats()});
$("newConversationButton").onclick=()=>openSimple("New conversation",c=>{const a=document.createElement("button");a.textContent="New chat";a.onclick=openNewChat;const g=document.createElement("button");g.textContent="New group";g.onclick=openNewGroup;c.append(a,g)});
function openNewChat(){openSimple("New chat",c=>{const choose=document.createElement("button");choose.textContent="Choose from contacts";choose.onclick=chooseContact;const lab=document.createElement("label");lab.textContent="Search by phone number";lab.htmlFor="newPhone";const inp=document.createElement("input");inp.id="newPhone";inp.type="tel";const find=document.createElement("button");find.textContent="Find person";const res=document.createElement("div");find.onclick=()=>findPerson(inp.value,res);c.append(choose,lab,inp,find,res)})}
async function chooseContact(){if(!("contacts"in navigator)||!("ContactsManager"in window))return status("Choose from contacts is not supported on this device. Use phone-number search.");try{const cs=await navigator.contacts.select(["name","tel"],{multiple:false});if(cs?.[0]?.tel?.[0]){const holder=$("simpleContent").querySelector("input");holder.value=cs[0].tel[0];$("simpleContent").querySelectorAll("button")[1].click()}}catch(e){status(err(e))}}
async function findPerson(phone,res){res.innerHTML="";try{const d=await get(ref(db,"phoneDirectory/"+phoneKey(phone)));if(!d.exists())return res.textContent="No account found.";const uid=d.val();if(uid===currentUser.uid)return res.textContent="That is your own account.";const p=(await get(ref(db,"users/"+uid))).val();if(p.searchable===false)return res.textContent="No account found.";const b=document.createElement("button");b.textContent=`Start chat with ${p.displayName}`;b.onclick=()=>startIndividual(uid,p.displayName);res.append(b)}catch(e){status(err(e))}}
async function startIndividual(uid,name){const id=chatIdFor(currentUser.uid,uid),now=Date.now();await update(ref(db),{["chats/"+id]:{type:"individual",members:{[currentUser.uid]:true,[uid]:true},createdAt:now,updatedAt:now,lastMessage:""},["userChats/"+currentUser.uid+"/"+id]:{type:"individual",otherUid:uid,otherName:name,chatName:name,updatedAt:now,lastMessage:"",unreadCount:0},["userChats/"+uid+"/"+id]:{type:"individual",otherUid:currentUser.uid,otherName:currentProfile.displayName,chatName:currentProfile.displayName,updatedAt:now,lastMessage:"",unreadCount:0}});openChat({id,type:"individual",otherUid:uid,chatName:name,otherName:name})}
function openNewGroup(){openSimple("New group",c=>{const lab=document.createElement("label");lab.textContent="Group name";const inp=document.createElement("input");inp.maxLength=60;const next=document.createElement("button");next.textContent="Choose members";next.onclick=()=>groupMemberPicker(inp.value.trim());c.append(lab,inp,next)})}
function groupMemberPicker(name){if(!name)return status("Enter a group name.");openSimple("Choose members",c=>{const chosen=new Set();const help=document.createElement("p");help.textContent="Search each person by phone number and add them.";const inp=document.createElement("input");inp.type="tel";inp.placeholder="Phone number";const find=document.createElement("button");find.textContent="Find person";const results=document.createElement("div"),members=document.createElement("ul");members.className="list";find.onclick=async()=>{results.innerHTML="";const d=await get(ref(db,"phoneDirectory/"+phoneKey(inp.value)));if(!d.exists())return results.textContent="No account found.";const uid=d.val();if(uid===currentUser.uid||chosen.has(uid))return results.textContent="Already included.";const p=(await get(ref(db,"users/"+uid))).val();const b=document.createElement("button");b.textContent=`Add ${p.displayName}`;b.onclick=()=>{chosen.add(uid);const li=document.createElement("li");li.textContent=p.displayName;li.dataset.uid=uid;members.append(li);results.innerHTML=""};results.append(b)};const create=document.createElement("button");create.textContent="Create group";create.onclick=()=>createGroup(name,[...chosen]);c.append(help,inp,find,results,members,create)})}
async function createGroup(name,uids){if(!uids.length)return status("Add at least one other person.");const id=push(ref(db,"chats")).key,now=Date.now(),members={[currentUser.uid]:true},admins={[currentUser.uid]:true};uids.forEach(u=>members[u]=true);const updates={["chats/"+id]:{type:"group",name,members,admins,creatorId:currentUser.uid,createdAt:now,updatedAt:now,lastMessage:`${currentProfile.displayName} created the group`,lastMessageType:"system"}};for(const uid of Object.keys(members))updates["userChats/"+uid+"/"+id]={type:"group",chatName:name,updatedAt:now,lastMessage:`${currentProfile.displayName} created the group`,unreadCount:uid===currentUser.uid?0:1};await update(ref(db),updates);await addSystemMessage(id,`${currentProfile.displayName} created the group`);openChat({id,type:"group",chatName:name})}
async function openChat(c){activeChat=c;show($("homeScreen"),false);show($("simpleScreen"),false);show($("chatScreen"),true);$("chatHeading").textContent=c.nickname||c.chatName||c.otherName||"Chat";$("chatSubheading").textContent=c.type==="group"?"Group details":"Chat details";$("pageTitle").textContent=$("chatHeading").textContent;replyTo=null;show($("replyBanner"),false);$("messageInput").value=localStorage.getItem("draft:"+c.id)||"";watchMessages(c.id);watchTyping(c.id);setTyping(false)}
function watchMessages(id){if(stopMessages)stopMessages();let first=true,oldCount=0;stopMessages=onValue(ref(db,"chats/"+id+"/messages"),snap=>{const box=$("messages");box.innerHTML="";const arr=[];snap.forEach(x=>arr.push({id:x.key,...x.val()}));arr.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));for(const m of arr)renderMessage(m,box);if(!first&&arr.length>oldCount){playSound();announce("New message")};first=false;oldCount=arr.length;box.scrollTop=box.scrollHeight})}
function renderMessage(m,box){if(m.deletedForEveryone){m={...m,text:m.senderId===currentUser.uid?"You deleted this message.":"This message was deleted."}}const b=document.createElement("button");b.className="message "+(m.type==="system"?"system":m.senderId===currentUser.uid?"mine":"theirs");b.dataset.messageId=m.id;let label="";if(m.replyTo?.text)label+=`Replying to ${m.replyTo.senderName}: ${m.replyTo.text}. `;label+=(m.type==="system"?m.text:`${m.senderName||"Unknown"}: ${m.text}. ${formatTime(m.timestamp)}.`);if(m.senderId===currentUser.uid&&m.type!=="system"){const read=Object.keys(m.readBy||{}).length,del=Object.keys(m.deliveredTo||{}).length;label+=read?` Read by ${read}.`:del?" Delivered.":" Sent."}const reacts=Object.entries(m.reactions||{}).map(([u,r])=>r?.emoji).filter(Boolean);if(reacts.length)label+=` Reactions: ${reacts.join(", ")}.`;b.setAttribute("aria-label",label);if(m.replyTo?.text){const q=document.createElement("span");q.className="quote";q.textContent=`${m.replyTo.senderName}: ${m.replyTo.text}`;q.onclick=e=>{e.stopPropagation();const t=box.querySelector(`[data-message-id="${m.replyTo.messageId}"]`);t?.focus()};b.append(q)}const tx=document.createElement("span");tx.textContent=m.text;b.append(tx);if(m.type!=="system"){const time=document.createElement("span");time.className="message-time";time.textContent=formatTime(m.timestamp);b.append(time)}if(reacts.length){const r=document.createElement("span");r.className="message-extra";r.textContent="Reactions: "+reacts.join(" ");b.append(r)}b.onclick=()=>m.type!=="system"&&messageOptions(m);b.onfocus=()=>markRead(m);box.append(b)}
async function markRead(m){if(!activeChat||m.senderId===currentUser.uid||m.type==="system")return;const now=Date.now();await update(ref(db),{["chats/"+activeChat.id+"/messages/"+m.id+"/readBy/"+currentUser.uid]:now,["chats/"+activeChat.id+"/messages/"+m.id+"/deliveredTo/"+currentUser.uid]:now,["userChats/"+currentUser.uid+"/"+activeChat.id+"/unreadCount"]:0,["userChats/"+currentUser.uid+"/"+activeChat.id+"/lastReadAt"]:now})}
function messageOptions(m){const d=$("actionDialog"),a=$("actionButtons");a.innerHTML="";const add=(name,fn,cls="")=>{const b=document.createElement("button");b.textContent=name;b.className=cls;b.onclick=async()=>{d.close();await fn()};a.append(b)};add("Reply",()=>{replyTo={messageId:m.id,senderName:m.senderName,text:m.text.slice(0,180)};$("replyText").textContent=`Replying to ${replyTo.senderName}: ${replyTo.text}`;show($("replyBanner"),true);$("messageInput").focus()});add("React",()=>reactTo(m));add("Copy",async()=>{await navigator.clipboard.writeText(m.text);status("Message copied.")});if(m.senderId===currentUser.uid&&!m.deletedForEveryone)add("Edit",()=>editMessage(m));add("Delete for me",()=>deleteForMe(m));if(m.senderId===currentUser.uid&&!m.deletedForEveryone)add("Delete for everyone",()=>update(ref(db,"chats/"+activeChat.id+"/messages/"+m.id),{deletedForEveryone:true,text:""}),"danger");d.showModal()}
$("closeActionDialog").onclick=()=>$("actionDialog").close();$("cancelReply").onclick=()=>{replyTo=null;show($("replyBanner"),false)};
async function reactTo(m){const emoji=prompt("Enter one emoji reaction");if(!emoji)return;await set(ref(db,`chats/${activeChat.id}/messages/${m.id}/reactions/${currentUser.uid}`),{emoji,name:currentProfile.displayName})}async function editMessage(m){const t=prompt("Edit message",m.text);if(t&&t.trim())await update(ref(db,`chats/${activeChat.id}/messages/${m.id}`),{text:t.trim()})}async function deleteForMe(m){await set(ref(db,`hiddenMessages/${currentUser.uid}/${activeChat.id}/${m.id}`),true);status("Deleted from your view.")}
let typingTimer=null;$("messageInput").addEventListener("input",()=>{if(!activeChat)return;localStorage.setItem("draft:"+activeChat.id,$("messageInput").value);setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),1800)});async function setTyping(v){if(!activeChat||!currentUser)return;const r=ref(db,`chats/${activeChat.id}/typing/${currentUser.uid}`);if(v){await set(r,{name:currentProfile.displayName,at:Date.now()});onDisconnect(r).remove()}else await remove(r).catch(()=>{})}
function watchTyping(id){if(stopTyping)stopTyping();let previous="";stopTyping=onValue(ref(db,`chats/${id}/typing`),s=>{const names=[];s.forEach(x=>{if(x.key!==currentUser.uid&&Date.now()-(x.val().at||0)<5000)names.push(x.val().name)});let text="";if(names.length===1)text=`${names[0]} is typing`;else if(names.length===2)text=`${names[0]} and ${names[1]} are typing`;else if(names.length>2)text=`${names[0]}, ${names[1]} and ${names.length-2} others are typing`;$("typingStatus").textContent=text;if(text!==previous){if(text)announce(text);else if(previous)announce("Typing stopped");previous=text}update(ref(db,`userChats/${currentUser.uid}/${id}`),{typingText:text}).catch(()=>{})})}
async function sendMessage(){const input=$("messageInput"),text=input.value.trim();if(!text||!activeChat)return;const now=Date.now(),id=push(ref(db,`chats/${activeChat.id}/messages`)).key,msg={senderId:currentUser.uid,senderName:currentProfile.displayName,text,timestamp:now,type:"text",replyTo:replyTo||null,deliveredTo:{[currentUser.uid]:now},readBy:{[currentUser.uid]:now}};input.value="";localStorage.removeItem("draft:"+activeChat.id);replyTo=null;show($("replyBanner"),false);input.focus();try{await set(ref(db,`chats/${activeChat.id}/messages/${id}`),msg);const chatSnap=await get(ref(db,`chats/${activeChat.id}`)),chat=chatSnap.val(),updates={[`chats/${activeChat.id}/updatedAt`]:now,[`chats/${activeChat.id}/lastMessage`]:text,[`chats/${activeChat.id}/lastMessageSenderName`]:currentProfile.displayName};for(const uid of Object.keys(chat.members||{})){updates[`userChats/${uid}/${activeChat.id}/updatedAt`]=now;updates[`userChats/${uid}/${activeChat.id}/lastMessage`]=`${currentProfile.displayName}: ${text}`;if(uid!==currentUser.uid)updates[`userChats/${uid}/${activeChat.id}/unreadCount`]=(await get(ref(db,`userChats/${uid}/${activeChat.id}/unreadCount`))).val()+1||1}await update(ref(db),updates);notifyMembers(chat,text)}catch(e){await set(ref(db,`failedMessages/${currentUser.uid}/${activeChat.id}/${id}`),msg);status("Not sent. Retry or cancel from Message options.");input.value=text;input.focus()}}
$("sendButton").onclick=sendMessage;$("composer").onsubmit=e=>{e.preventDefault();sendMessage()};$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage()}});
async function notifyMembers(chat,text){try{const token=await currentUser.getIdToken();await fetch(workerUrl,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({chatId:activeChat.id,senderName:currentProfile.displayName,messageText:text})})}catch(e){console.error(e)}}
async function addSystemMessage(chatId,text){const now=Date.now(),m=push(ref(db,`chats/${chatId}/messages`));await set(m,{type:"system",text,timestamp:now,senderId:currentUser.uid,senderName:currentProfile.displayName})}
$("chatDetailsButton").onclick=()=>activeChat?.type==="group"?openGroupDetails():openIndividualDetails();
function openIndividualDetails(){openSimple($("chatHeading").textContent,c=>{const info=document.createElement("p");info.textContent=activeChat.otherName||activeChat.chatName;const pin=button(activeChat.pinned?"Unpin chat":"Pin chat",()=>toggleChatSetting("pinned",!activeChat.pinned));const mute=button("Mute chat",openMuteMenu);const nick=button("Set nickname",setNickname);const search=button("Search messages",searchMessages);const block=button("Block person",blockPerson,"danger");c.append(info,pin,mute,nick,search,block)})}
function openGroupDetails(){openSimple($("chatHeading").textContent,async c=>{const chat=(await get(ref(db,"chats/"+activeChat.id))).val(),isAdmin=!!chat.admins?.[currentUser.uid];c.append(button(activeChat.pinned?"Unpin group":"Pin group",()=>toggleChatSetting("pinned",!activeChat.pinned)),button("Mute group",openMuteMenu),button("Search messages",searchMessages));const h=document.createElement("h3");h.textContent="Members";c.append(h);for(const uid of Object.keys(chat.members||{})){const p=(await get(ref(db,"users/"+uid))).val(),row=document.createElement("div");row.className="member-row";const s=document.createElement("span");s.textContent=p.displayName+(chat.admins?.[uid]?", admin":"");row.append(s);if(isAdmin&&uid!==currentUser.uid){const manage=button("Manage",()=>manageMember(uid,p.displayName,!!chat.admins?.[uid]));manage.className="secondary inline";row.append(manage)}c.append(row)}if(isAdmin)c.append(button("Add person",()=>addGroupPerson(chat)));c.append(button("Leave group",leaveGroup,"danger"))})}
function button(name,fn,cls=""){const b=document.createElement("button");b.textContent=name;b.className=cls;b.onclick=fn;return b}async function toggleChatSetting(k,v){await update(ref(db,`userChats/${currentUser.uid}/${activeChat.id}`),{[k]:v});activeChat[k]=v;status("Updated.")}function setNickname(){const n=prompt("Nickname",activeChat.nickname||"");if(n!==null)toggleChatSetting("nickname",n.trim())}function openMuteMenu(){openSimple("Mute",c=>{[["1 hour",3600000],["8 hours",28800000],["1 week",604800000],["Always",-1]].forEach(([n,d])=>c.append(button(n,()=>toggleChatSetting("mutedUntil",d<0?-1:Date.now()+d))));const lab=document.createElement("label");lab.textContent="Until a date and time";const inp=document.createElement("input");inp.type="datetime-local";c.append(lab,inp,button("Mute until this time",()=>toggleChatSetting("mutedUntil",new Date(inp.value).getTime())))})}function searchMessages(){const q=prompt("Search messages");if(!q)return;document.querySelectorAll(".message").forEach(m=>m.classList.toggle("hidden",!m.textContent.toLowerCase().includes(q.toLowerCase())))}async function blockPerson(){await update(ref(db),{[`blocks/${currentUser.uid}/${activeChat.otherUid}`]:true,[`userChats/${currentUser.uid}/${activeChat.id}/blocked`]:true});goHome();status("Person blocked.")}async function manageMember(uid,name,isAdmin){openSimple(name,c=>{c.append(button(isAdmin?"Remove admin":"Make admin",()=>update(ref(db,`chats/${activeChat.id}/admins`),{[uid]:isAdmin?null:true})),button("Remove from group",()=>removeMember(uid,name),"danger"))}async function removeMember(uid,name){await update(ref(db),{[`chats/${activeChat.id}/members/${uid}`]:null,[`chats/${activeChat.id}/admins/${uid}`]:null,[`userChats/${uid}/${activeChat.id}`]:null});await addSystemMessage(activeChat.id,`${currentProfile.displayName} removed ${name}`);openGroupDetails()}async function addGroupPerson(chat){openSimple("Add person",c=>{const i=document.createElement("input");i.type="tel";const b=button("Find and add",async()=>{const d=await get(ref(db,"phoneDirectory/"+phoneKey(i.value)));if(!d.exists())return status("No account found.");const uid=d.val(),p=(await get(ref(db,"users/"+uid))).val();await update(ref(db),{[`chats/${activeChat.id}/members/${uid}`]:true,[`userChats/${uid}/${activeChat.id}`]:{type:"group",chatName:chat.name,updatedAt:Date.now(),lastMessage:`${currentProfile.displayName} added ${p.displayName}`,unreadCount:1}});await addSystemMessage(activeChat.id,`${currentProfile.displayName} added ${p.displayName}`);status("Person added.")});c.append(i,b)})}async function leaveGroup(){const chat=(await get(ref(db,"chats/"+activeChat.id))).val();await update(ref(db),{[`chats/${activeChat.id}/members/${currentUser.uid}`]:null,[`chats/${activeChat.id}/admins/${currentUser.uid}`]:null,[`userChats/${currentUser.uid}/${activeChat.id}`]:null});await addSystemMessage(activeChat.id,`${currentProfile.displayName} left the group`);goHome()}
$("settingsButton").onclick=()=>openSettingsMain();function openSettingsMain(replace=false){if(!replace)screenStack=[];openSimple("Settings",c=>{c.append(settingButton("Account","Name, phone number and password",openAccount),settingButton("Notifications","Push notifications and message sounds",openNotifications),settingButton("Appearance and accessibility","Text size, contrast and announcements",openAppearance),settingButton("Chat behaviour","Drafts, typing and opening chats",openChatBehaviour),settingButton("Privacy","Blocked people and phone-number search",openPrivacy),settingButton("Storage","Clear local drafts and settings",openStorage),button("Sign out",()=>signOut(auth),"danger"))})}function settingButton(n,v,fn){const b=button(n,fn,"secondary setting-button");b.innerHTML=`${n}<span class="setting-value">${v}</span>`;return b}
function openAccount(){openSimple("Account",c=>{const n=document.createElement("input");n.value=currentProfile.displayName;const save=button("Save display name",async()=>{await update(ref(db,"users/"+currentUser.uid),{displayName:n.value.trim()});currentProfile.displayName=n.value.trim();status("Name saved.")});const phone=document.createElement("p");phone.textContent=`Phone number: ${currentProfile.phone}`;const pw=document.createElement("input");pw.type="password";pw.placeholder="New password";const cp=button("Change password",async()=>{await updatePassword(currentUser,pw.value);status("Password changed.")});c.append(n,save,phone,pw,cp)})}
function openNotifications(){openSimple("Notifications",async c=>{let perm=typeof Notification==="undefined"?"Unavailable":Notification.permission;const p=document.createElement("p");p.textContent=`Notifications: ${perm}`;c.append(p);if(perm!=="granted")c.append(button("Enable notifications",enableNotifications));c.append(toggleButton("In-app message sound",settings.messageSound!==false,v=>settings.messageSound=v),toggleButton("VoiceOver announcement for new messages",!!settings.voiceAnnouncements,v=>settings.voiceAnnouncements=v),toggleButton("Show message text in notifications",settings.notificationPreview!==false,v=>settings.notificationPreview=v))})}
function openAppearance(){openSimple("Appearance and accessibility",c=>{const s=document.createElement("select");[["standard","Standard text"],["large","Large text"],["xlarge","Extra large text"]].forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;s.append(o)});s.value=settings.textSize||"standard";s.onchange=()=>{settings.textSize=s.value;saveSettings();applySettings()};c.append(s,toggleButton("High contrast",!!settings.highContrast,v=>settings.highContrast=v),toggleButton("Reduce animations",!!settings.reduceAnimations,v=>settings.reduceAnimations=v))})}
function openChatBehaviour(){openSimple("Chat behaviour",c=>{c.append(toggleButton("Reopen last chat",!!settings.reopenLast,v=>settings.reopenLast=v),toggleButton("Show typing indicators",settings.showTyping!==false,v=>settings.showTyping=v),toggleButton("Show read receipts",settings.readReceipts!==false,v=>settings.readReceipts=v),toggleButton("Confirm before deleting",settings.confirmDelete!==false,v=>settings.confirmDelete=v))})}
function openPrivacy(){openSimple("Privacy",c=>{c.append(toggleButton("Allow people to find me by phone number",currentProfile.searchable!==false,async v=>{currentProfile.searchable=v;await update(ref(db,"users/"+currentUser.uid),{searchable:v})}),button("Blocked people",openBlocked))})}
function openBlocked(){openSimple("Blocked people",c=>{const blocked=chatEntries.filter(x=>x.blocked);if(!blocked.length)c.textContent="No blocked people.";for(const x of blocked)c.append(button(x.chatName||x.otherName,async()=>{await update(ref(db),{[`blocks/${currentUser.uid}/${x.otherUid}`]:null,[`userChats/${currentUser.uid}/${x.id}/blocked`]:false});status("Unblocked. The chat is back on Home.")}))})}
function openStorage(){openSimple("Storage",c=>{c.append(button("Clear saved drafts",()=>{Object.keys(localStorage).filter(k=>k.startsWith("draft:")).forEach(k=>localStorage.removeItem(k));status("Drafts cleared.")}),button("Reset local app settings",()=>{localStorage.removeItem("messengerSettings");location.reload()},"danger"))})}
function toggleButton(name,value,onchange){const wrap=document.createElement("label");wrap.className="checkbox-row";const i=document.createElement("input");i.type="checkbox";i.checked=value;const s=document.createElement("span");s.textContent=name;i.onchange=async()=>{await onchange(i.checked);saveSettings();applySettings()};wrap.append(i,s);return wrap}
async function enableNotifications(){try{if(!(await isSupported()))return status("Push notifications are not supported.");const p=await Notification.requestPermission();if(p!=="granted")return status("Notifications were not allowed.");const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js"),messaging=getMessaging(app),token=await getToken(messaging,{vapidKey,serviceWorkerRegistration:reg});await set(ref(db,`notificationTokens/${currentUser.uid}/${encodeURIComponent(token)}`),{token,createdAt:Date.now(),platform:navigator.userAgent});status("Notifications enabled.")}catch(e){status(err(e))}}
let pushReady=false;async function setupForegroundPush(){if(pushReady)return;try{if(!(await isSupported()))return;onMessage(getMessaging(app),p=>{playSound();announce(p.notification?.title||"New message")});pushReady=true}catch{}}
