function back(){
  const dialog=$("actionDialog");
  if(dialog.open){
    dialog.close();
    return;
  }

  if(!$("chatScreen").classList.contains("hidden")){
    goHome();
    return;
  }

  if(!$("simpleScreen").classList.contains("hidden")){
    screenStack.pop();

    if(screenStack.length){
      const previous=screenStack[screenStack.length-1];
      if(previous.kind==="chat"){
        screenStack=[];
        show($("homeScreen"),false);
        show($("simpleScreen"),false);
        show($("chatScreen"),true);
        $("pageTitle").textContent=$("chatHeading").textContent||"Chat";
        requestAnimationFrame(()=>$("chatDetailsButton").focus());
      }else{
        renderSimpleScreen(previous.title,previous.renderer);
      }
    }else{
      goHome();
    }
    return;
  }

  goHome();

onAuthStateChanged(auth,async u=>{
  try{

async function repairChatListEntry(chatId,otherUid,otherName,lastMessage="",type="individual"){
  if(!currentUser||!chatId)return;

  let entry={
    type,
    chatName:otherName||"Conversation",
    updatedAt:Date.now(),
    lastMessage:lastMessage||""
  };

  if(type==="individual"&&otherUid){
    entry.otherUid=otherUid;
    entry.otherName=otherName||"Conversation";
  }

  const existing=await get(ref(db,`userChats/${currentUser.uid}/${chatId}`)).catch(()=>null);
  if(existing?.exists()){
    const old=existing.val()||{};
    entry={...old,...entry};
  }

  await set(ref(db,`userChats/${currentUser.uid}/${chatId}`),entry);
}

async function repairChatFromPayload(payload){
  const data=payload?.data||{};
  const chatId=data.chatId;
  const senderUid=data.senderUid||data.senderId;
  const senderName=data.senderName||payload?.notification?.title||"Conversation";
  const messageText=data.messageText||payload?.notification?.body||"";
  const type=data.chatType||data.type||"individual";

  if(!chatId||!currentUser)return;

  try{
    await repairChatListEntry(chatId,senderUid,senderName,messageText,type);
  }catch(e){
    console.error("Could not repair missing chat:",e);
  }
}

async function repairAllMyChats({silent=false}={}){
  if(!currentUser){
    const result={ok:false,error:"You are not signed in."};
    status(result.error);
    return result;
  }

  try{
    if(!silent)status("Refreshing chats…");

    const token=await currentUser.getIdToken(true);
    const response=await fetch(workerUrl+"/repair-chats",{
      method:"POST",
      headers:{
        Authorization:`Bearer ${token}`,
        "Content-Type":"application/json"
      },
      body:"{}"
    });

    const responseText=await response.text();
    let result={};

    try{
      result=responseText?JSON.parse(responseText):{};
    }catch{
      result={error:responseText||`Worker returned ${response.status}.`};
    }

    if(!response.ok){
      throw new Error(result.error||`Worker returned ${response.status}.`);
    }

    const found=Number(result.chatsFound||0);
    const created=Number(result.entriesCreated||0);

    if(result.entries&&typeof result.entries==="object"){
      workerChatEntries=Object.entries(result.entries).map(([id,value])=>({id,...value}));
      mergeAndRenderChats();
    }

    const message=
      result.message||
      `${found} chats found. ${created} missing chat entries restored.`;

    if(!silent)status(message);
    return {...result,ok:true,message};
  }catch(error){
    console.error("Chat-list repair failed:",error);
    const message="Refresh chats failed: "+err(error);
    if(!silent)status(message);
    return {ok:false,error:message};
  }
}

function mergeAndRenderChats(firebaseEntries=null){
  const merged=new Map();

  for(const chat of workerChatEntries){
    if(chat?.id)merged.set(chat.id,{...chat});
  }

  const liveEntries=firebaseEntries||chatEntries;
  for(const chat of liveEntries){
    if(!chat?.id)continue;
    const previous=merged.get(chat.id)||{};
    merged.set(chat.id,{...previous,...chat});
  }

  chatEntries=[...merged.values()];
  renderChats();
}

  if(stopChats)stopChats();
  stopChats=onValue(
    ref(db,"userChats/"+currentUser.uid),
    snap=>{
      const firebaseEntries=[];
      snap.forEach(c=>firebaseEntries.push({id:c.key,...c.val()}));
      mergeAndRenderChats(firebaseEntries);
    },
    error=>{
      console.error("Chat-list listener failed:",error);
      mergeAndRenderChats([]);
      status("The live chat list could not update, but repaired chats are still shown.");
    }
  );
}

  });

  if(currentFilter!=="all"){
    listItems=listItems.filter(chat=>chat.type===currentFilter);
  }

  listItems.sort((a,b)=>{

    return (b.updatedAt||0)-(a.updatedAt||0);

      chat.nickname||chat.chatName||chat.otherName||"Conversation",
      chat.type==="group"?"group chat":"",
      unread?`${unread} unread`:"",
      chat.pinned?"pinned":""

async function startIndividual(uid,name){
  const id=chatIdFor(currentUser.uid,uid);
  const now=Date.now();

  try{
    status("Opening chat…");

    const chatRef=ref(db,"chats/"+id);
    const existing=await get(chatRef);
    const existingChat=existing.val()||{};

    if(!existing.exists()){
      await set(chatRef,{
        type:"individual",
        members:{
          [currentUser.uid]:true,
          [uid]:true
        },
        createdAt:now,
        updatedAt:now,
        lastMessage:""
      });
    }else{
      await update(chatRef,{
        type:existingChat.type||"individual",
        [`members/${currentUser.uid}`]:true,
        [`members/${uid}`]:true
      });
    }

    let unreadCount=0;
    try{
      unreadCount=Number(
        (await get(ref(db,`userChats/${currentUser.uid}/${id}/unreadCount`))).val()||0
      );
    }catch{}

    const currentEntry={
      type:"individual",
      otherUid:uid,
      otherName:name,
      chatName:name,
      updatedAt:existingChat.updatedAt||now,
      lastMessage:existingChat.lastMessage||"",
      unreadCount,
      blocked:false
    };

    await set(
      ref(db,`userChats/${currentUser.uid}/${id}`),
      currentEntry
    );

    const verification=await get(
      ref(db,`userChats/${currentUser.uid}/${id}`)
    );

    if(!verification.exists()){
      throw new Error("The Home-screen chat entry was not saved.");
    }

    const visibleEntry={id,...verification.val()};
    const existingIndex=chatEntries.findIndex(chat=>chat.id===id);

    if(existingIndex>=0){
      chatEntries[existingIndex]=visibleEntry;
    }else{
      chatEntries.push(visibleEntry);
    }

    const workerIndex=workerChatEntries.findIndex(chat=>chat.id===id);
    if(workerIndex>=0)workerChatEntries[workerIndex]=visibleEntry;
    else workerChatEntries.push(visibleEntry);

    mergeAndRenderChats();

    const otherEntry={
      type:"individual",
      otherUid:currentUser.uid,
      otherName:currentProfile.displayName,
      chatName:currentProfile.displayName,
      updatedAt:existingChat.updatedAt||now,
      lastMessage:existingChat.lastMessage||"",
      unreadCount:0,
      blocked:false
    };

    set(
      ref(db,`userChats/${uid}/${id}`),
      otherEntry
    ).catch(error=>{
      console.error("Could not repair the other person's chat entry:",error);
    });

    status(`${name} was added to your Chats list.`);
    await openChat(visibleEntry);
  }catch(error){
    console.error("Could not start chat:",error);
    status("Could not start the chat: "+err(error));
  }
}

async function createGroup(name,uids){
  if(!uids.length)return status("Add at least one other person.");

  const id=push(ref(db,"chats")).key;
  const now=Date.now();
  const members={[currentUser.uid]:true};
  const admins={[currentUser.uid]:true};
  uids.forEach(uid=>members[uid]=true);
  const systemText=`${currentProfile.displayName} created the group`;

  try{
    status("Creating group…");
    await set(ref(db,"chats/"+id),{
      type:"group",
      name,
      members,
      admins,
      creatorId:currentUser.uid,
      createdAt:now,
      updatedAt:now,
      lastMessage:systemText,
      lastMessageSenderName:"",
      lastMessageType:"system"
    });

    const entries={};
    for(const uid of Object.keys(members)){
      entries[`userChats/${uid}/${id}`]={
        type:"group",
        chatName:name,
        updatedAt:now,
        lastMessage:systemText,
        unreadCount:uid===currentUser.uid?0:1
      };
    }
    await update(ref(db),entries);
    await addSystemMessage(id,systemText);
    status("");
    await openChat({id,type:"group",chatName:name,updatedAt:now,lastMessage:systemText});
  }catch(error){
    status("Could not create the group: "+err(error));
  }
}
async function openChat(c){
  try{
    const chatSnap=await get(ref(db,"chats/"+c.id));
    const chat=chatSnap.val()||{};
    let repaired={...c};

    if((chat.type||c.type)==="group"){
      repaired={
        ...repaired,
        type:"group",
        chatName:c.chatName||chat.name||"Group"
      };

      await update(ref(db,`userChats/${currentUser.uid}/${c.id}`),{
        type:"group",
        chatName:repaired.chatName,
        updatedAt:chat.updatedAt||c.updatedAt||Date.now(),
        lastMessage:chat.lastMessage||c.lastMessage||"",
        unreadCount:c.unreadCount||0
      });
    }else{
      const memberIds=Object.keys(chat.members||{});
      const otherUid=c.otherUid||memberIds.find(uid=>uid!==currentUser.uid);
      let otherName=c.otherName||c.chatName||"Conversation";

      if(otherUid&&(!c.otherName||!c.chatName)){
        const profileSnap=await get(ref(db,"users/"+otherUid)).catch(()=>null);
        otherName=profileSnap?.val()?.displayName||otherName;
      }

      repaired={
        ...repaired,
        type:"individual",
        otherUid,
        otherName,
        chatName:c.chatName||otherName
      };

      const ownEntry={
        type:"individual",
        otherUid,
        otherName,
        chatName:repaired.chatName,
        updatedAt:chat.updatedAt||c.updatedAt||Date.now(),
        lastMessage:chat.lastMessage||c.lastMessage||"",
        unreadCount:Number(c.unreadCount||0),
        blocked:false
      };

      await set(
        ref(db,`userChats/${currentUser.uid}/${c.id}`),
        ownEntry
      );

      const ownIndex=chatEntries.findIndex(item=>item.id===c.id);
      const visibleOwnEntry={id:c.id,...ownEntry};

      if(ownIndex>=0){
        chatEntries[ownIndex]=visibleOwnEntry;
      }else{
        chatEntries.push(visibleOwnEntry);
      }

      const workerIndex=workerChatEntries.findIndex(item=>item.id===c.id);
      if(workerIndex>=0)workerChatEntries[workerIndex]=visibleOwnEntry;
      else workerChatEntries.push(visibleOwnEntry);

      mergeAndRenderChats();
    }

    activeChat=repaired;
  }catch(error){
    console.error("Could not repair opened chat:",error);
    activeChat=c;
  }

  show($("homeScreen"),false);
  show($("simpleScreen"),false);
  show($("chatScreen"),true);
  $("chatHeading").textContent=activeChat.nickname||activeChat.chatName||activeChat.otherName||"Chat";
  $("chatSubheading").textContent=activeChat.type==="group"?"Group details":"Chat details";
  $("pageTitle").textContent=$("chatHeading").textContent;
  replyTo=null;
  show($("replyBanner"),false);
  $("messageInput").value=localStorage.getItem("draft:"+activeChat.id)||"";
  localStorage.setItem("lastChatId",activeChat.id);
  watchHiddenMessages(activeChat.id);
  watchFailedMessages(activeChat.id);
  watchMessages(activeChat.id);
  watchTyping(activeChat.id);
  setTyping(false);
}
function watchHiddenMessages(chatId){
  if(stopHidden)stopHidden();
  stopHidden=onValue(ref(db,`hiddenMessages/${currentUser.uid}/${chatId}`),snapshot=>{
    hiddenMessageIds=new Set();
    snapshot.forEach(child=>{
      if(child.val()===true)hiddenMessageIds.add(child.key);
    });
    if(activeChat?.id===chatId)watchMessages(chatId);
  });
}

function watchFailedMessages(chatId){
  if(stopFailed)stopFailed();
  stopFailed=onValue(ref(db,`failedMessages/${currentUser.uid}/${chatId}`),snapshot=>{
    failedMessages=[];
    snapshot.forEach(child=>failedMessages.push({id:child.key,...child.val(),failed:true}));
    if(activeChat?.id===chatId)watchMessages(chatId);
  });
}

function watchMessages(id){
  if(stopMessages)stopMessages();
  let first=true;
  let oldCount=0;

  stopMessages=onValue(ref(db,`chats/${id}/messages`),snapshot=>{
    const box=$("messages");
    box.innerHTML="";
    const messages=[];

    snapshot.forEach(child=>{
      if(!hiddenMessageIds.has(child.key)){
        messages.push({id:child.key,...child.val()});
      }
    });

    for(const failed of failedMessages){
      if(!hiddenMessageIds.has(failed.id))messages.push(failed);
    }

    messages.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    for(const message of messages)renderMessage(message,box);

    if(!first&&messages.length>oldCount){
      playSound();
      announce("New message");
    }

    first=false;
    oldCount=messages.length;
    box.scrollTop=box.scrollHeight;

    markDelivered(messages.filter(message=>!message.failed));
  });
}

async function markDelivered(messages){
  if(!activeChat)return;
  const now=Date.now();
  const updates={};

  for(const message of messages){
    if(
      message.type!=="system" &&
      message.senderId!==currentUser.uid &&
      !message.deliveredTo?.[currentUser.uid]
    ){
      updates[`chats/${activeChat.id}/messages/${message.id}/deliveredTo/${currentUser.uid}`]=now;
    }
  }

  if(Object.keys(updates).length){
    await update(ref(db),updates).catch(()=>{});
  }
}

function renderMessage(original,box){
  let message=original;

  if(message.deletedForEveryone){
    message={
      ...message,
      text:message.senderId===currentUser.uid
        ?"You deleted this message."
        :"This message was deleted."
    };
  }

  const messageButton=document.createElement("button");
  messageButton.className="message "+(
    message.type==="system"
      ?"system"
      :message.senderId===currentUser.uid
        ?"mine"
        :"theirs"
  );
  messageButton.dataset.messageId=message.id;

  let label="";
  if(message.replyTo?.text){
    label+=`Replying to ${message.replyTo.senderName}: ${message.replyTo.text}. `;
  }

  if(message.type==="system"){
    label+=message.text;
  }else{
    label+=`${message.senderName||"Unknown"}: ${message.text}. ${formatTime(message.timestamp)}.`;

    if(message.failed){
      label+=" Not sent.";
    }else if(message.senderId===currentUser.uid&&settings.readReceipts!==false){
      const readBy=Object.keys(message.readBy||{}).filter(uid=>uid!==currentUser.uid);
      const deliveredTo=Object.keys(message.deliveredTo||{}).filter(uid=>uid!==currentUser.uid);

      if(activeChat?.type==="group"){
        if(readBy.length)label+=` Read by ${readBy.length}.`;
        else if(deliveredTo.length)label+=` Delivered to ${deliveredTo.length}.`;
        else label+=" Sent.";
      }else{
        if(readBy.length)label+=" Read.";
        else if(deliveredTo.length)label+=" Delivered.";
        else label+=" Sent.";
      }
    }
  }

  const reactions=Object.values(message.reactions||{})
    .map(reaction=>reaction?.emoji)
    .filter(Boolean);

  if(reactions.length){
    label+=` Reactions: ${reactions.join(", ")}.`;
  }

  messageButton.setAttribute("aria-label",label);

  if(message.replyTo?.text){
    const quote=document.createElement("span");
    quote.className="quote";
    quote.textContent=`${message.replyTo.senderName}: ${message.replyTo.text}`;
    quote.onclick=event=>{
      event.stopPropagation();
      box.querySelector(`[data-message-id="${message.replyTo.messageId}"]`)?.focus();
    };
    messageButton.append(quote);
  }

  const textSpan=document.createElement("span");
  textSpan.textContent=message.text;
  messageButton.append(textSpan);

  if(message.type!=="system"){
    const time=document.createElement("span");
    time.className="message-time";
    time.textContent=message.failed?"Not sent":formatTime(message.timestamp);
    messageButton.append(time);
  }

  if(reactions.length){
    const reactionSpan=document.createElement("span");
    reactionSpan.className="message-extra";
    reactionSpan.textContent="Reactions: "+reactions.join(" ");
    messageButton.append(reactionSpan);
  }

  messageButton.onclick=()=>message.type!=="system"&&messageOptions(message);
  messageButton.onfocus=()=>markRead(message);
  box.append(messageButton);
}

async function markRead(message){
  if(
    !activeChat ||
    message.failed ||
    message.senderId===currentUser.uid ||
    message.type==="system" ||
    message.readBy?.[currentUser.uid]
  )return;

  const now=Date.now();

  try{
    const unreadSnapshot=await get(ref(db,`userChats/${currentUser.uid}/${activeChat.id}/unreadCount`));
    const unread=Math.max(0,Number(unreadSnapshot.val()||0)-1);

    await update(ref(db),{
      [`chats/${activeChat.id}/messages/${message.id}/readBy/${currentUser.uid}`]:now,
      [`chats/${activeChat.id}/messages/${message.id}/deliveredTo/${currentUser.uid}`]:now,
      [`userChats/${currentUser.uid}/${activeChat.id}/unreadCount`]:unread,
      [`userChats/${currentUser.uid}/${activeChat.id}/lastReadAt`]:now
    });
  }catch(error){
    console.error("Could not mark message as read:",error);
  }
}
function messageOptions(message){
  const dialog=$("actionDialog");
  const actions=$("actionButtons");
  actions.innerHTML="";

  const add=(name,action,className="")=>{
    const actionButton=document.createElement("button");
    actionButton.textContent=name;
    actionButton.className=className;
    actionButton.onclick=async()=>{
      dialog.close();
      await action();
    };
    actions.append(actionButton);
  };

  if(message.failed){
    add("Retry",()=>retryFailedMessage(message));
    add("Cancel failed message",()=>remove(ref(db,`failedMessages/${currentUser.uid}/${activeChat.id}/${message.id}`)),"danger");
    add("Copy",async()=>{
      await navigator.clipboard.writeText(message.text);
      status("Message copied.");
    });
    dialog.showModal();
    return;
  }

  add("Reply",()=>{
    replyTo={
      messageId:message.id,
      senderName:message.senderName,
      text:message.text.slice(0,180)
    };
    $("replyText").textContent=`Replying to ${replyTo.senderName}: ${replyTo.text}`;
    show($("replyBanner"),true);
    $("messageInput").focus();
  });

  add("React",()=>reactTo(message));
  add("Copy",async()=>{
    await navigator.clipboard.writeText(message.text);
    status("Message copied.");
  });

  if(message.senderId===currentUser.uid&&!message.deletedForEveryone){
    add("Edit",()=>editMessage(message));
  }

  add("Delete for me",()=>deleteForMe(message));

  if(message.senderId===currentUser.uid&&!message.deletedForEveryone){
    add("Delete for everyone",async()=>{
      if(settings.confirmDelete!==false&&!confirm("Delete this message for everyone?"))return;
      await update(ref(db,`chats/${activeChat.id}/messages/${message.id}`),{
        deletedForEveryone:true,
        text:""
      });
    },"danger");
  }

  dialog.showModal();
}

async function sendMessage(){
  const input=$("messageInput");
  const text=input.value.trim();

  if(!text||!activeChat)return;

  const now=Date.now();
  const id=push(ref(db,`chats/${activeChat.id}/messages`)).key;
  const msg={
    senderId:currentUser.uid,
    senderName:currentProfile.displayName,
    text,
    timestamp:now,
    type:"text",
    deliveredTo:{[currentUser.uid]:now},
    readBy:{[currentUser.uid]:now}
  };

  if(replyTo)msg.replyTo=replyTo;

  try{
    status("Sending…");

    const chatSnap=await get(ref(db,`chats/${activeChat.id}`));
    if(!chatSnap.exists())throw new Error("This conversation could not be found.");

    const chat=chatSnap.val();
    const members=Object.keys(chat.members||{});
    const preview=`${currentProfile.displayName}: ${text}`;
    const updates={
      [`chats/${activeChat.id}/messages/${id}`]:msg,
      [`chats/${activeChat.id}/updatedAt`]:now,
      [`chats/${activeChat.id}/lastMessage`]:text,
      [`chats/${activeChat.id}/lastMessageSenderName`]:currentProfile.displayName
    };

    for(const uid of members){
      updates[`userChats/${uid}/${activeChat.id}/updatedAt`]=now;
      updates[`userChats/${uid}/${activeChat.id}/lastMessage`]=preview;
      updates[`userChats/${uid}/${activeChat.id}/type`]=chat.type||activeChat.type||"individual";

      if((chat.type||activeChat.type)==="group"){
        updates[`userChats/${uid}/${activeChat.id}/chatName`]=chat.name||activeChat.chatName||"Group";
      }else{
        const otherUid=members.find(memberUid=>memberUid!==uid);
        updates[`userChats/${uid}/${activeChat.id}/otherUid`]=otherUid||"";
        updates[`userChats/${uid}/${activeChat.id}/chatName`]=
          uid===currentUser.uid
            ? (activeChat.chatName||activeChat.otherName||"Conversation")
            : currentProfile.displayName;
        updates[`userChats/${uid}/${activeChat.id}/otherName`]=
          uid===currentUser.uid
            ? (activeChat.otherName||activeChat.chatName||"Conversation")
            : currentProfile.displayName;
      }

      updates[`userChats/${uid}/${activeChat.id}/unreadCount`]=
        uid===currentUser.uid?0:increment(1);
    }

    await update(ref(db),updates);

    input.value="";
    localStorage.removeItem("draft:"+activeChat.id);
    replyTo=null;
    show($("replyBanner"),false);
    status("Message sent.");
    input.focus();

    notifyMembers(chat,text);
  }catch(error){
    console.error("Send failed:",error);
    await set(ref(db,`failedMessages/${currentUser.uid}/${activeChat.id}/${id}`),{
      ...msg,
      error:err(error)
    }).catch(()=>{});
    status("Not sent. Retry or cancel from Message options.");
    input.value="";
    localStorage.removeItem("draft:"+activeChat.id);
    input.focus();
  }
}

async function addSystemMessage(chatId,text){const now=Date.now(),m=push(ref(db,`chats/${chatId}/messages`));await set(m,{type:"system",text,timestamp:now,senderId:currentUser.uid,senderName:currentProfile.displayName})}
$("chatDetailsButton").onclick=()=>activeChat?.type==="group"?openGroupDetails():openIndividualDetails();
function openIndividualDetails(){openSimple($("chatHeading").textContent,async c=>{const info=document.createElement("p");let phoneText="";if(activeChat.otherUid){const profile=await get(ref(db,"users/"+activeChat.otherUid)).catch(()=>null);phoneText=profile?.val()?.phone||""}info.textContent=[activeChat.otherName||activeChat.chatName,phoneText].filter(Boolean).join(", ");const pin=button(activeChat.pinned?"Unpin chat":"Pin chat",()=>toggleChatSetting("pinned",!activeChat.pinned));const mute=button("Mute chat",openMuteMenu);const nick=button("Set nickname",setNickname);const search=button("Search messages",searchMessages);const block=button("Block person",blockPerson,"danger");c.append(info,pin,mute,nick,search,block)})}
function openGroupDetails(){openSimple($("chatHeading").textContent,async c=>{const chat=(await get(ref(db,"chats/"+activeChat.id))).val(),isAdmin=!!chat.admins?.[currentUser.uid];c.append(button(activeChat.pinned?"Unpin group":"Pin group",()=>toggleChatSetting("pinned",!activeChat.pinned)),button("Mute group",openMuteMenu),button("Search messages",searchMessages));const h=document.createElement("h3");h.textContent="Members";c.append(h);for(const uid of Object.keys(chat.members||{})){const p=(await get(ref(db,"users/"+uid))).val(),row=document.createElement("div");row.className="member-row";const s=document.createElement("span");s.textContent=p.displayName+(chat.admins?.[uid]?", admin":"");row.append(s);if(isAdmin&&uid!==currentUser.uid){const manage=button("Manage",()=>manageMember(uid,p.displayName,!!chat.admins?.[uid]));manage.className="secondary inline";row.append(manage)}c.append(row)}if(isAdmin)c.append(button("Add person",()=>addGroupPerson(chat)));c.append(button("Leave group",leaveGroup,"danger"))})}
function button(name,fn,cls=""){const b=document.createElement("button");b.textContent=name;b.className=cls;b.onclick=fn;return b}async function toggleChatSetting(k,v){await update(ref(db,`userChats/${currentUser.uid}/${activeChat.id}`),{[k]:v});activeChat[k]=v;status("Updated.")}function setNickname(){const n=prompt("Nickname",activeChat.nickname||"");if(n!==null)toggleChatSetting("nickname",n.trim())}function openMuteMenu(){openSimple("Mute",c=>{[["1 hour",3600000],["8 hours",28800000],["1 week",604800000],["Always",-1]].forEach(([n,d])=>c.append(button(n,()=>toggleChatSetting("muteUntil",d<0?"always":Date.now()+d))));const lab=document.createElement("label");lab.textContent="Until a date and time";const inp=document.createElement("input");inp.type="datetime-local";c.append(lab,inp,button("Mute until this time",()=>toggleChatSetting("muteUntil",new Date(inp.value).getTime())))})}function searchMessages(){const q=prompt("Search messages");if(!q)return;document.querySelectorAll(".message").forEach(m=>m.classList.toggle("hidden",!m.textContent.toLowerCase().includes(q.toLowerCase())))}async function blockPerson(){await update(ref(db),{[`blocks/${currentUser.uid}/${activeChat.otherUid}`]:true,[`userChats/${currentUser.uid}/${activeChat.id}/blocked`]:true});goHome();status("Person blocked.")}async function manageMember(uid,name,isAdmin){openSimple(name,c=>{c.append(button(isAdmin?"Remove admin":"Make admin",()=>update(ref(db,`chats/${activeChat.id}/admins`),{[uid]:isAdmin?null:true})),button("Remove from group",()=>removeMember(uid,name),"danger"));});}async function removeMember(uid,name){
  await remove(ref(db,`userChats/${uid}/${activeChat.id}`));
  await update(ref(db,`chats/${activeChat.id}`),{
    [`members/${uid}`]:null,
    [`admins/${uid}`]:null
  });
  await addSystemMessage(activeChat.id,`${currentProfile.displayName} removed ${name}`);
  openGroupDetails();
}
async function addGroupPerson(chat){
  openSimple("Add person",c=>{
    const input=document.createElement("input");
    input.type="tel";
    input.placeholder="Phone number";
    const addButton=button("Find and add",async()=>{
      try{
        const directory=await get(ref(db,"phoneDirectory/"+phoneKey(input.value)));
        if(!directory.exists())return status("No account found.");
        const uid=directory.val();
        if(chat.members?.[uid])return status("That person is already in the group.");
        const profile=(await get(ref(db,"users/"+uid))).val();
        const now=Date.now();

        await set(ref(db,`chats/${activeChat.id}/members/${uid}`),true);
        await set(ref(db,`userChats/${uid}/${activeChat.id}`),{
          type:"group",
          chatName:chat.name,
          updatedAt:now,
          lastMessage:`${currentProfile.displayName} added ${profile.displayName}`,
          unreadCount:1
        });
        await addSystemMessage(activeChat.id,`${currentProfile.displayName} added ${profile.displayName}`);
        status("Person added.");
      }catch(error){
        status("Could not add the person: "+err(error));
      }
    });
    c.append(input,addButton);
  });
}
async function leaveGroup(){
  const chatId=activeChat.id;
  const displayName=currentProfile.displayName;
  await addSystemMessage(chatId,`${displayName} left the group`);
  await remove(ref(db,`userChats/${currentUser.uid}/${chatId}`));
  await update(ref(db,`chats/${chatId}`),{
    [`members/${currentUser.uid}`]:null,
    [`admins/${currentUser.uid}`]:null
  });
  goHome();
}
$("settingsButton").onclick=()=>{
  screenStack=[];
  openSettingsMain();
};
function openSettingsMain(){
  openSimple("Settings",c=>{
    c.append(
      settingButton("Account","Name, phone number and password",openAccount),
      settingButton("Notifications","Push notifications and message sounds",openNotifications),
      settingButton("Appearance and accessibility","Text size, contrast and announcements",openAppearance),
      settingButton("Chat behaviour","Drafts, typing and opening chats",openChatBehaviour),
      settingButton("Privacy","Blocked people and phone-number search",openPrivacy),
      settingButton("Storage","Clear local drafts and settings",openStorage),
      button("Sign out",()=>signOut(auth),"danger")
    );
  });
}
function settingButton(n,v,fn){
  const b=button(n,fn,"secondary setting-button");
  b.innerHTML=`${n}<span class="setting-value">${v}</span>`;
  return b;
}
function openAccount(){openSimple("Account",c=>{const n=document.createElement("input");n.value=currentProfile.displayName;const save=button("Save display name",async()=>{await update(ref(db,"users/"+currentUser.uid),{displayName:n.value.trim()});currentProfile.displayName=n.value.trim();status("Name saved.")});const phone=document.createElement("p");phone.textContent=`Phone number: ${currentProfile.phone}`;const pw=document.createElement("input");pw.type="password";pw.placeholder="New password";const cp=button("Change password",async()=>{await updatePassword(currentUser,pw.value);status("Password changed.")});c.append(n,save,phone,pw,cp)})}
function openNotifications(){openSimple("Notifications",async c=>{let perm=typeof Notification==="undefined"?"Unavailable":Notification.permission;const p=document.createElement("p");p.textContent=`Notifications: ${perm}`;c.append(p);if(perm!=="granted")c.append(button("Enable notifications",enableNotifications));c.append(toggleButton("In-app message sound",settings.messageSound!==false,v=>settings.messageSound=v),toggleButton("VoiceOver announcement for new messages",!!settings.voiceAnnouncements,v=>settings.voiceAnnouncements=v))})}
function openAppearance(){openSimple("Appearance and accessibility",c=>{const s=document.createElement("select");[["standard","Standard text"],["large","Large text"],["xlarge","Extra large text"]].forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;s.append(o)});s.value=settings.textSize||"standard";s.onchange=()=>{settings.textSize=s.value;saveSettings();applySettings()};c.append(s,toggleButton("High contrast",!!settings.highContrast,v=>settings.highContrast=v),toggleButton("Reduce animations",!!settings.reduceAnimations,v=>settings.reduceAnimations=v))})}
function openChatBehaviour(){openSimple("Chat behaviour",c=>{c.append(toggleButton("Reopen last chat",!!settings.reopenLast,v=>settings.reopenLast=v),toggleButton("Show typing indicators",settings.showTyping!==false,v=>settings.showTyping=v),toggleButton("Show read receipts",settings.readReceipts!==false,v=>settings.readReceipts=v),toggleButton("Confirm before deleting",settings.confirmDelete!==false,v=>settings.confirmDelete=v))})}
function openPrivacy(){openSimple("Privacy",c=>{c.append(toggleButton("Allow people to find me by phone number",currentProfile.searchable!==false,async v=>{currentProfile.searchable=v;await update(ref(db,"users/"+currentUser.uid),{searchable:v})}),button("Blocked people",openBlocked))})}
function openBlocked(){openSimple("Blocked people",c=>{const blocked=chatEntries.filter(x=>x.blocked);if(!blocked.length)c.textContent="No blocked people.";for(const x of blocked)c.append(button(x.chatName||x.otherName,async()=>{await update(ref(db),{[`blocks/${currentUser.uid}/${x.otherUid}`]:null,[`userChats/${currentUser.uid}/${x.id}/blocked`]:false});status("Unblocked. The chat is back on Home.")}))})}
function openStorage(){openSimple("Storage",c=>{c.append(button("Clear saved drafts",()=>{Object.keys(localStorage).filter(k=>k.startsWith("draft:")).forEach(k=>localStorage.removeItem(k));status("Drafts cleared.")}),button("Reset local app settings",()=>{localStorage.removeItem("messengerSettings");location.reload()},"danger"))})}
function toggleButton(name,value,onchange){const wrap=document.createElement("label");wrap.className="checkbox-row";const i=document.createElement("input");i.type="checkbox";i.checked=value;const s=document.createElement("span");s.textContent=name;i.onchange=async()=>{await onchange(i.checked);saveSettings();applySettings()};wrap.append(i,s);return wrap}
async function enableNotifications(){try{if(!(await isSupported()))return status("Push notifications are not supported.");const p=await Notification.requestPermission();if(p!=="granted")return status("Notifications were not allowed.");const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js"),messaging=getMessaging(app),token=await getToken(messaging,{vapidKey,serviceWorkerRegistration:reg});await set(ref(db,`notificationTokens/${currentUser.uid}/${encodeURIComponent(token)}`),{token,createdAt:Date.now(),platform:navigator.userAgent});status("Notifications enabled.")}catch(e){status(err(e))}}
let pushReady=false;
async function setupForegroundPush(){
  if(pushReady)return;
  try{
    if(!(await isSupported()))return;
    onMessage(getMessaging(app),async payload=>{
      await repairChatFromPayload(payload);
      playSound();
      announce(payload.notification?.title||"New message");
    });
    pushReady=true;
  }catch(e){
    console.error("Foreground notifications could not start:",e);
  }
}
</script>
