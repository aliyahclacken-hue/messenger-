<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Messenger">
  <title>Messenger</title>
  <meta name="app-version" content="1.0.2">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
      --bg: #f4f6f5;
      --card: #ffffff;
      --text: #17211d;
      --muted: #5d6b65;
      --accent: #0b6b4f;
      --accent-text: #ffffff;
      --border: #cfd8d3;
      --danger: #a31717;
      --mine: #d7f7e8;
      --theirs: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111816;
        --card: #18221e;
        --text: #f0f6f3;
        --muted: #b2c0ba;
        --border: #3a4943;
        --mine: #174f3c;
        --theirs: #26332e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      position: sticky; top: 0; z-index: 5;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--accent); color: var(--accent-text);
    }
    h1, h2 { margin: 0; }
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.2rem; margin-bottom: 14px; }
    main { max-width: 720px; margin: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .hidden { display: none !important; }
    label { display: block; font-weight: 650; margin: 12px 0 6px; }
    input, button {
      width: 100%; min-height: 48px; font: inherit; border-radius: 10px;
    }
    input {
      border: 1px solid var(--border); padding: 10px 12px;
      background: var(--card); color: var(--text);
    }
    button {
      border: 0; padding: 10px 14px; font-weight: 700;
      background: var(--accent); color: var(--accent-text); margin-top: 10px;
    }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); }
    button.inline { width: auto; min-height: 42px; margin: 0; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    nav {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
      margin-bottom: 14px;
    }
    nav button { margin: 0; }
    .status { min-height: 24px; margin: 8px 0; font-weight: 600; }
    .muted { color: var(--muted); }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { border-top: 1px solid var(--border); padding: 12px 0; }
    .list li:first-child { border-top: 0; }
    .chat-button {
      text-align: left; background: transparent; color: var(--text);
      border: 0; padding: 4px 0; margin: 0;
    }
    .chat-name { display: block; font-weight: 750; }
    .chat-preview { display: block; color: var(--muted); margin-top: 4px; }
    #messages {
      min-height: 42vh; max-height: 58vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px; padding: 6px 0 14px;
    }
    .message {
      max-width: 84%; padding: 10px 12px; border-radius: 14px;
      border: 1px solid var(--border);
    }
    .mine { align-self: flex-end; background: var(--mine); }
    .theirs { align-self: flex-start; background: var(--theirs); }
    .message-time { display: block; font-size: .78rem; color: var(--muted); margin-top: 4px; }
    #composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #composer button { width: auto; margin: 0; }
  </style>
</head>
<body>
<header><h1 id="pageTitle">Messenger</h1></header>
<main>
  <p id="globalStatus" class="status" role="status" aria-live="polite"></p>

  <section id="authScreen" class="card">
    <h2>Welcome</h2>
    <div id="signInPanel">
      <label for="signInEmail">Email</label>
      <input id="signInEmail" type="email" autocomplete="email" inputmode="email">
      <label for="signInPassword">Password</label>
      <input id="signInPassword" type="password" autocomplete="current-password">
      <button id="signInButton">Sign in</button>
      <button id="showCreateButton" class="secondary">Create account</button>
      <button id="resetPasswordButton" class="secondary">Reset password</button>
    </div>

    <div id="createPanel" class="hidden">
      <label for="displayName">Display name</label>
      <input id="displayName" autocomplete="name" maxlength="40">
      <label for="phoneNumber">Phone number</label>
      <input id="phoneNumber" type="tel" autocomplete="tel" inputmode="tel" placeholder="+44 7700 900000">
      <label for="createEmail">Email</label>
      <input id="createEmail" type="email" autocomplete="email" inputmode="email">
      <label for="createPassword">Password</label>
      <input id="createPassword" type="password" autocomplete="new-password" minlength="6">
      <button id="createButton">Create account</button>
      <button id="showSignInButton" class="secondary">Back to sign in</button>
    </div>
  </section>

  <section id="appScreen" class="hidden">
    <nav aria-label="Main">
      <button data-view="chats">Chats</button>
      <button data-view="contacts">Contacts</button>
      <button data-view="settings">Settings</button>
    </nav>

    <section id="chatsView" class="card">
      <h2>Chats</h2>
      <ul id="chatList" class="list"></ul>
      <p id="emptyChats" class="muted">No chats yet. Add somebody from Contacts.</p>
    </section>

    <section id="contactsView" class="card hidden">
      <h2>Find a person</h2>
      <label for="contactPhone">Their phone number</label>
      <input id="contactPhone" type="tel" inputmode="tel" placeholder="+44 7700 900000">
      <button id="findContactButton">Find person</button>
      <div id="contactResult"></div>
    </section>

    <section id="settingsView" class="card hidden">
      <h2>Settings</h2>
      <p id="accountSummary"></p>
      <button id="enableNotificationsButton">Enable notifications</button>
      <button id="signOutButton" class="danger">Sign out</button>
    </section>

    <section id="chatView" class="card hidden" aria-label="Conversation">
      <div class="row">
        <button id="backToChatsButton" class="secondary inline">Back</button>
        <h2 id="chatHeading">Chat</h2>
      </div>
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="composer">
        <label for="messageInput" class="hidden">Message</label>
        <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message">
        <button id="sendMessageButton" type="button">Send</button>
      </form>
    </section>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, push, onValue,
  serverTimestamp, query, orderByChild
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import {
  getMessaging, getToken, onMessage, isSupported
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0seDdHj7OhNf6hx2-AZIDn1qhQpbFLTk",
  authDomain: "messenger-e50bf.firebaseapp.com",
  databaseURL: "https://messenger-e50bf-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "messenger-e50bf",
  storageBucket: "messenger-e50bf.firebasestorage.app",
  messagingSenderId: "751067866902",
  appId: "1:751067866902:web:2a705579192497a5a4d237"
};
const vapidKey = "BKIVCQ4_bGgcxccIRl_f6w9y1Ci9HFxaYPRXAVpCjnG7ABKf6y8BHoM3LJ_a4v-JmxLMZQndmLpuKSBUb0TXCVk";
const notificationWorkerUrl = "https://messengernotifications.aliyah-clacken.workers.dev";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);
const status = message => $("globalStatus").textContent = message;
const show = (el, yes = true) => el.classList.toggle("hidden", !yes);

let currentUser = null;
let currentProfile = null;
let activeChatId = null;
let activeOtherUser = null;
let stopMessages = null;
let stopChats = null;

function normalisePhone(value) {
  let phone = value.trim().replace(/[^\d+]/g, "");
  if (phone.startsWith("00")) phone = "+" + phone.slice(2);
  if (phone.startsWith("0")) phone = "+44" + phone.slice(1);
  if (!phone.startsWith("+")) phone = "+" + phone;
  return phone;
}
function phoneKey(phone) {
  return normalisePhone(phone).replace(/\D/g, "");
}
function chatIdFor(a, b) {
  return [a, b].sort().join("_");
}
function readableError(error) {
  return (error?.message || "Something went wrong.")
    .replace("Firebase: ", "")
    .replace(/\(auth\/[^)]+\)\.?/, "")
    .trim();
}
async function sendPushNotification(recipientUid, chatId, messageText) {
  if (!currentUser || !currentProfile) return;

  const idToken = await currentUser.getIdToken();

  const response = await fetch(notificationWorkerUrl, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${idToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      recipientUid,
      chatId,
      senderName: currentProfile.displayName,
      messageText
    })
  });

  let result = {};
  try {
    result = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(result.error || "The push notification could not be sent.");
  }

  return result;
}

function playMessageSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.18);
  } catch {}
}
function switchView(name) {
  ["chats","contacts","settings"].forEach(v => show($(v + "View"), v === name));
  show($("chatView"), false);
  $("pageTitle").textContent = name[0].toUpperCase() + name.slice(1);
}
document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => switchView(button.dataset.view));
});

$("showCreateButton").onclick = () => {
  show($("signInPanel"), false); show($("createPanel"), true);
};
$("showSignInButton").onclick = () => {
  show($("createPanel"), false); show($("signInPanel"), true);
};

$("createButton").onclick = async () => {
  const name = $("displayName").value.trim();
  const phone = normalisePhone($("phoneNumber").value);
  const email = $("createEmail").value.trim();
  const password = $("createPassword").value;
  if (!name || phone.length < 8 || !email || password.length < 6) {
    status("Enter a display name, a valid phone number, an email and a password of at least six characters.");
    return;
  }
  try {
    status("Creating account…");
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    const uid = credential.user.uid;
    const existing = await get(ref(db, "phoneDirectory/" + phoneKey(phone)));
    if (existing.exists()) {
      await credential.user.delete();
      throw new Error("That phone number is already registered.");
    }
    await update(ref(db), {
      ["users/" + uid]: { displayName: name, phone, createdAt: Date.now() },
      ["phoneDirectory/" + phoneKey(phone)]: uid
    });
    status("Account created.");
  } catch (error) {
    status(readableError(error));
  }
};

$("signInButton").onclick = async () => {
  try {
    status("Signing in…");
    await signInWithEmailAndPassword(auth, $("signInEmail").value.trim(), $("signInPassword").value);
    status("");
  } catch (error) { status(readableError(error)); }
};
$("resetPasswordButton").onclick = async () => {
  const email = $("signInEmail").value.trim();
  if (!email) { status("Enter your email address first."); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    status("Password reset email sent.");
  } catch (error) { status(readableError(error)); }
};
$("signOutButton").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  currentUser = user;
  activeChatId = null;
  if (stopMessages) stopMessages();
  if (stopChats) stopChats();
  show($("authScreen"), !user);
  show($("appScreen"), !!user);
  if (!user) {
    currentProfile = null;
    $("pageTitle").textContent = "Messenger";
    return;
  }
  const snap = await get(ref(db, "users/" + user.uid));
  currentProfile = snap.val();
  if (!currentProfile) {
    status("Your profile could not be loaded.");
    return;
  }
  $("accountSummary").textContent = `${currentProfile.displayName}, ${currentProfile.phone}`;
  switchView("chats");
  watchChats();
});

function watchChats() {
  const chatsRef = query(ref(db, "userChats/" + currentUser.uid), orderByChild("updatedAt"));
  stopChats = onValue(chatsRef, snap => {
    const entries = [];
    snap.forEach(child => entries.push({ id: child.key, ...child.val() }));
    entries.reverse();
    const list = $("chatList");
    list.innerHTML = "";
    show($("emptyChats"), entries.length === 0);
    for (const chat of entries) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.className = "chat-button";
      const name = document.createElement("span");
      name.className = "chat-name";
      name.textContent = chat.otherName || "Conversation";
      const preview = document.createElement("span");
      preview.className = "chat-preview";
      preview.textContent = chat.lastMessage || "No messages yet";
      button.append(name, preview);
      button.onclick = () => openChat(chat.id, chat.otherUid, chat.otherName);
      li.appendChild(button);
      list.appendChild(li);
    }
  });
}

$("findContactButton").onclick = async () => {
  const key = phoneKey($("contactPhone").value);
  const result = $("contactResult");
  result.innerHTML = "";
  if (key.length < 7) { status("Enter a valid phone number."); return; }
  try {
    const directory = await get(ref(db, "phoneDirectory/" + key));
    if (!directory.exists()) {
      result.textContent = "No account was found with that phone number.";
      return;
    }
    const uid = directory.val();
    if (uid === currentUser.uid) {
      result.textContent = "That is your own account.";
      return;
    }
    const profileSnap = await get(ref(db, "users/" + uid));
    const profile = profileSnap.val();
    const p = document.createElement("p");
    p.textContent = profile.displayName;
    const button = document.createElement("button");
    button.textContent = "Start chat";
    button.onclick = () => startChat(uid, profile.displayName);
    result.append(p, button);
  } catch (error) { status(readableError(error)); }
};

async function startChat(otherUid, otherName) {
  const id = chatIdFor(currentUser.uid, otherUid);
  const now = Date.now();

  try {
    status("Opening chat…");

    const chatRef = ref(db, "chats/" + id);
    const existingChat = await get(chatRef).catch(() => null);

    if (!existingChat || !existingChat.exists()) {
      await set(chatRef, {
        members: {
          [currentUser.uid]: true,
          [otherUid]: true
        },
        createdAt: now,
        updatedAt: now,
        lastMessage: ""
      });
    }

    await update(ref(db), {
      ["userChats/" + currentUser.uid + "/" + id]: {
        otherUid,
        otherName,
        updatedAt: now,
        lastMessage: ""
      },
      ["userChats/" + otherUid + "/" + id]: {
        otherUid: currentUser.uid,
        otherName: currentProfile.displayName,
        updatedAt: now,
        lastMessage: ""
      }
    });

    status("");
    openChat(id, otherUid, otherName);
  } catch (error) {
    console.error("Start chat failed:", error);
    status("Could not start the chat: " + readableError(error));
  }
}

function openChat(id, otherUid, otherName) {
  activeChatId = id;
  activeOtherUser = { uid: otherUid, name: otherName };
  show($("chatsView"), false); show($("contactsView"), false); show($("settingsView"), false);
  show($("chatView"), true);
  $("chatHeading").textContent = otherName || "Chat";
  $("pageTitle").textContent = otherName || "Chat";
  if (stopMessages) stopMessages();
  let initial = true;
  stopMessages = onValue(ref(db, "chats/" + id + "/messages"), snap => {
    const box = $("messages");
    const previousCount = box.childElementCount;
    box.innerHTML = "";
    snap.forEach(child => {
      const msg = child.val();
      const article = document.createElement("article");
      article.className = "message " + (msg.senderId === currentUser.uid ? "mine" : "theirs");
      const text = document.createElement("div");
      text.textContent = msg.text;
      const time = document.createElement("time");
      time.className = "message-time";
      time.textContent = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : "Sending…";
      article.append(text, time);
      box.appendChild(article);
    });
    box.scrollTop = box.scrollHeight;
    if (!initial && box.childElementCount > previousCount) playMessageSound();
    initial = false;
  });
}
$("backToChatsButton").onclick = () => switchView("chats");

async function sendCurrentMessage() {
  const input = $("messageInput");
  const messageText = input.value.trim();

  if (!messageText) {
    status("Type a message first.");
    input.focus();
    return;
  }

  if (!currentUser) {
    status("You are not signed in.");
    return;
  }

  if (!activeChatId || !activeOtherUser) {
    status("This chat is not ready. Go back and open it again.");
    return;
  }

  const sendButton = $("sendMessageButton");
  sendButton.disabled = true;
  status("Sending…");

  const now = Date.now();

  try {
    const messageRef = push(ref(db, "chats/" + activeChatId + "/messages"));

    await set(messageRef, {
      senderId: currentUser.uid,
      text: messageText,
      timestamp: now
    });

    await update(ref(db), {
      ["chats/" + activeChatId + "/updatedAt"]: now,
      ["chats/" + activeChatId + "/lastMessage"]: messageText,
      ["userChats/" + currentUser.uid + "/" + activeChatId + "/updatedAt"]: now,
      ["userChats/" + currentUser.uid + "/" + activeChatId + "/lastMessage"]: messageText,
      ["userChats/" + activeOtherUser.uid + "/" + activeChatId + "/updatedAt"]: now,
      ["userChats/" + activeOtherUser.uid + "/" + activeChatId + "/lastMessage"]: messageText
    });

    input.value = "";
    status("Message sent.");

    try {
      const notificationResult = await sendPushNotification(
        activeOtherUser.uid,
        activeChatId,
        messageText
      );

      if (notificationResult?.sent === 0 && notificationResult?.message) {
        status("Message sent. " + notificationResult.message);
      }
    } catch (notificationError) {
      console.error("Push notification failed:", notificationError);
      status(
        "Message sent, but the push notification failed: " +
        readableError(notificationError)
      );
    }
  } catch (error) {
    console.error("Send message failed:", error);
    status("Could not send message: " + readableError(error));
  } finally {
    sendButton.disabled = false;
  }
}

$("sendMessageButton").addEventListener("click", sendCurrentMessage);

$("composer").addEventListener("submit", event => {
  event.preventDefault();
  sendCurrentMessage();
});

$("enableNotificationsButton").onclick = async () => {
  try {
    if (!(await isSupported())) {
      status("Push notifications are not supported in this browser.");
      return;
    }
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      status("Notifications were not allowed.");
      return;
    }
    const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey, serviceWorkerRegistration: registration });
    if (!token) throw new Error("No notification token was created.");
    await set(ref(db, `notificationTokens/${currentUser.uid}/${encodeURIComponent(token)}`), {
      token, createdAt: Date.now(), platform: navigator.userAgent
    });
    onMessage(messaging, payload => {
      playMessageSound();
      status(payload.notification?.title || "New message");
    });
    status("Notifications are enabled on this device.");
  } catch (error) { status(readableError(error)); }
};
</script>
</body>
</html>
